version: '3.8'

services:
  # ===========================================
  # BANCO DE DADOS POSTGRESQL
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: playwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: playwave_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Kj8#mP2$nL9
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - playwave-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playwave_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # REDIS - CACHE E MESSAGE BROKER
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: playwave-redis
    restart: unless-stopped
    command: redis-server --requirepass R7x$qW9@nB5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - playwave-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # RABBITMQ - MESSAGE BROKER
  # ===========================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: playwave-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: F4h&kL8#vG2
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - playwave-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # BACKEND - FASTAPI
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playwave-backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:Kj8#mP2$nL9@postgres:5432/playwave_db
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: playwave_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: Kj8#mP2$nL9
      
      # Redis
      REDIS_URL: redis://:R7x$qW9@nB5@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: R7x$qW9@nB5
      REDIS_DB: 0
      
      # RabbitMQ
      RABBITMQ_URL: amqp://admin:F4h&kL8#vG2@rabbitmq:5672/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: F4h&kL8#vG2
      RABBITMQ_VHOST: /
      
      # Celery
      CELERY_BROKER_URL: redis://:R7x$qW9@nB5@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:R7x$qW9@nB5@redis:6379/2
      CELERY_TASK_SERIALIZER: json
      CELERY_RESULT_SERIALIZER: json
      CELERY_ACCEPT_CONTENT: '["json"]'
      CELERY_TIMEZONE: America/Sao_Paulo
      CELERY_ENABLE_UTC: true
      
      # Security
      SECRET_KEY: H9@kL3$mN7#qP5!xR2*wT8$vB6@nJ4
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # Application
      DEBUG: "false"
      ENVIRONMENT: production
      API_V1_STR: /api/v1
      PROJECT_NAME: Play Wave API
      VERSION: 1.0.0
      
      # CORS
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173","http://127.0.0.1:3000"]'
      
      # Upload
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 104857600
      ALLOWED_IMAGE_TYPES: '["image/jpeg","image/png","image/gif","image/webp"]'
      ALLOWED_VIDEO_TYPES: '["video/mp4","video/avi","video/mov","video/webm"]'
      ALLOWED_AUDIO_TYPES: '["audio/mp3","audio/wav","audio/ogg","audio/m4a","audio/aac"]'
      
      # Log
      LOG_LEVEL: INFO
      LOG_FORMAT: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      
      # Cache
      CACHE_TTL: 3600
      CACHE_PREFIX: playwave:
      
      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: 60
      RATE_LIMIT_BURST: 100
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - playwave-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # CELERY WORKER - TAREFAS ASSÍNCRONAS
  # ===========================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playwave-celery-worker
    restart: unless-stopped
    command: celery -A core.celery worker --loglevel=info --concurrency=4
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:Kj8#mP2$nL9@postgres:5432/playwave_db
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: playwave_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: Kj8#mP2$nL9
      
      # Redis
      REDIS_URL: redis://:R7x$qW9@nB5@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: R7x$qW9@nB5
      REDIS_DB: 0
      
      # RabbitMQ
      RABBITMQ_URL: amqp://admin:F4h&kL8#vG2@rabbitmq:5672/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: F4h&kL8#vG2
      RABBITMQ_VHOST: /
      
      # Celery
      CELERY_BROKER_URL: redis://:R7x$qW9@nB5@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:R7x$qW9@nB5@redis:6379/2
      CELERY_TASK_SERIALIZER: json
      CELERY_RESULT_SERIALIZER: json
      CELERY_ACCEPT_CONTENT: '["json"]'
      CELERY_TIMEZONE: America/Sao_Paulo
      CELERY_ENABLE_UTC: true
      
      # Security
      SECRET_KEY: H9@kL3$mN7#qP5!xR2*wT8$vB6@nJ4
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # Application
      DEBUG: "false"
      ENVIRONMENT: production
      PROJECT_NAME: Play Wave API
      VERSION: 1.0.0
      
      # Upload
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 104857600
      
      # Log
      LOG_LEVEL: INFO
      LOG_FORMAT: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - playwave-network

  # ===========================================
  # CELERY BEAT - AGENDADOR DE TAREFAS
  # ===========================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: playwave-celery-beat
    restart: unless-stopped
    command: celery -A core.celery beat --loglevel=info
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:Kj8#mP2$nL9@postgres:5432/playwave_db
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: playwave_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: Kj8#mP2$nL9
      
      # Redis
      REDIS_URL: redis://:R7x$qW9@nB5@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: R7x$qW9@nB5
      REDIS_DB: 0
      
      # RabbitMQ
      RABBITMQ_URL: amqp://admin:F4h&kL8#vG2@rabbitmq:5672/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: F4h&kL8#vG2
      RABBITMQ_VHOST: /
      
      # Celery
      CELERY_BROKER_URL: redis://:R7x$qW9@nB5@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:R7x$qW9@nB5@redis:6379/2
      CELERY_TASK_SERIALIZER: json
      CELERY_RESULT_SERIALIZER: json
      CELERY_ACCEPT_CONTENT: '["json"]'
      CELERY_TIMEZONE: America/Sao_Paulo
      CELERY_ENABLE_UTC: true
      
      # Security
      SECRET_KEY: H9@kL3$mN7#qP5!xR2*wT8$vB6@nJ4
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # Application
      DEBUG: "false"
      ENVIRONMENT: production
      PROJECT_NAME: Play Wave API
      VERSION: 1.0.0
      
      # Upload
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 104857600
      
      # Log
      LOG_LEVEL: INFO
      LOG_FORMAT: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - playwave-network

  # ===========================================
  # FRONTEND - REACT/VITE + NGINX
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: playwave-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_WS_URL: ws://localhost:8000/ws
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - playwave-network

  # ===========================================
  # NGINX - REVERSE PROXY
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: playwave-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - playwave-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ===========================================
# VOLUMES PERSISTENTES
# ===========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  nginx_logs:
    driver: local

# ===========================================
# REDE INTERNA
# ===========================================
networks:
  playwave-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
