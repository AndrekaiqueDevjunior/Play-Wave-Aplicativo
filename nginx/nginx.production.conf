events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logs ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ─────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;
    client_max_body_size 512m;

    # ── Compressão ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── SSL global ──────────────────────────────────────────────────────────
    ssl_protocols         TLSv1.2 TLSv1.3;
    ssl_ciphers           ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache     shared:SSL:10m;
    ssl_session_timeout   1d;
    ssl_session_tickets   off;

    # Docker DNS. Resolve upstreams at request time so Nginx can boot while
    # application containers are still starting or being recreated.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # =========================================================================
    # HTTP → HTTPS redirect + ACME challenge
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name playwave.com.br www.playwave.com.br;

        # Let's Encrypt webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check (não redireciona)
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Tudo o mais redireciona para HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # HTTPS — domínio principal
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name playwave.com.br www.playwave.com.br;

        # Certificados Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/playwave.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/playwave.com.br/privkey.pem;

        # ── Headers de segurança ────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        client_max_body_size 512m;

        # ── Backend API ─────────────────────────────────────────────────────
        location ~ ^/(api|devices|campaigns|media|audio|dashboard|locations|plans|tenants|users|reports|monitoring|schedule|user-logs)(/|$) {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect http://$host/ https://$host/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Uploads (mídia) ─────────────────────────────────────────────────
        location /uploads/ {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Health / Docs ───────────────────────────────────────────────────
        location ~ ^/(health|docs|openapi\.json|redoc)$ {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # ── WebSocket / SSE ─────────────────────────────────────────────────
        location /ws/ {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        # ── SSE para player updates (sem buffering) ─────────────────────────
        location ~ ^/api/v1/dispositivos/.+/stream {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding on;
        }

        # ── Frontend SPA ────────────────────────────────────────────────────
        location / {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }
    }
}
